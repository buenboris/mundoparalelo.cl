<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundoParalelo | Operaciones</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000; 
        }
        
        .main-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }

        .capa-full { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .z-fondo { z-index: 1; }
        .z-marco-9 { z-index: 2; opacity: 0.8; }
        .z-marco-10 { z-index: 4; }

        /* TU FOTO OPERANDO (Capa 8) */
        .capa-operador { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            z-index: 3; 
            width: 100%; /* Calza con el hueco del marco */
            height: auto;
            border: 1px solid rgba(0, 255, 255, 0.2); /* Un toque cian sutil */
        }

        /* LOGO CON TRANSPARENCIA PARA VERTE TRABAJAR */
        .capa-logo { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            z-index: 5; 
            width: 45%; 
            height: auto; 
            opacity: 0.3; /* Bajamos la opacidad para que se vea la foto 8 detras */
        }
    </style>
</head>
<body>

    <div class="main-container">
        <img src="1.png" class="capa-full z-fondo">
        <img src="9.png" class="capa-full z-marco-9">
        <img src="10.png" class="capa-full z-marco-10">
        
        <!-- Tu imagen operando -->
        <img src="8.png" class="capa-operador">

        <img src="2.png" class="capa-logo">
    </div>

</body>
</html>
