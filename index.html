<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundoParalelo | Servicios Audiovisuales</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS BASE (TU DEFAULT) --- */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        .main-container { position: relative; width: 100vw; height: 100vh; transition: 0.5s; }
        .video-fondo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .capa-fix { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .capa-operador { position: absolute; top: 0; left: -30%; width: 100%; height: 100%; object-fit: cover; z-index: 2; opacity: 0; transition: all 0.5s ease-in-out; pointer-events: none; }
        .z3 { z-index: 3; } .z4 { z-index: 4; }
        
        .logo-contenedor { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; text-align: center; z-index: 5; }
        .logo-principal { font-family: 'Orbitron', sans-serif; color: #00fbff; font-size: 4vw; font-weight: 650; letter-spacing: 8px; text-transform: uppercase; margin: 0; text-shadow: 0 0 8px rgba(0, 251, 255, 0.9); }
        .punto-cl { font-size: 3.5vw; opacity: 1; }

        /* --- MENÚ LATERAL --- */
        .menu-lateral { position: absolute; left: 30px; top: 35%; z-index: 20; display: flex; flex-direction: column; gap: 15px; }
        .btn-trigger { width: 220px; height: 55px; cursor: pointer; border-left: 3px solid #017b9e; background: rgba(1, 123, 158, 0.05); display: flex; align-items: center; padding-left: 15px; color: #017b9e; font-family: 'Orbitron', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
        .btn-trigger:hover { background: rgba(1, 123, 158, 0.15); color: #00ffff; border-left: 3px solid #00ffff; }
        .menu-lateral:hover ~ .capa-operador { left: -10%; opacity: 1; }

        /* --- HUD CRT Y EFECTOS --- */
        .blur-active { filter: blur(6px) brightness(0.5); }

        .teatro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 10000;
            backdrop-filter: blur(4px);
        }

        /* Apertura Estilo CRT */
        .contenedor-video-pro {
            width: 80%; max-width: 1100px; aspect-ratio: 16/9;
            position: relative; background: #000;
            border: 1px solid rgba(0, 255, 255, 0.2);
            transform: scaleX(0) scaleY(0.005);
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s;
            opacity: 0; overflow: hidden;
        }

        .contenedor-video-pro.abierto { transform: scaleX(1) scaleY(1); opacity: 1; }

        /* Capa de Scanlines */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 10;
        }

        #reproductorDrive { width: 100%; height: 100%; border: none; opacity: 0.85; /* Transparencia media */ }

        .cerrar-video { position: absolute; top: -45px; right: 0; color: #00ffff; font-family: 'Orbitron'; font-size: 14px; cursor: pointer; letter-spacing: 2px; }

        /* CONTACTO */
        .email { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 999; color: #00ffff; font-family: 'Orbitron'; text-decoration: none; font-size: 0.7rem; letter-spacing: 3px; text-align: center; }
    </style>
</head>
<body>

    <div class="main-container" id="escena">
        <div class="menu-lateral">
            <div class="btn-trigger">SERVICIO STREAMING PROFESIONAL</div>
            <div class="btn-trigger" onclick="verVideo()">NUESTROS SERVICIOS (VER VIDEO)</div>
            <div class="btn-trigger" onclick="location.href='contacto.html'">CONTACTO DIRECTO</div>
            <div class="btn-trigger">PROYECTOS 3D / VR</div>
        </div>

        <video autoplay muted loop playsinline class="video-fondo">
            <source src="./Plexus_BG.mp4" type="video/mp4">
        </video>

        <img src="8.png" class="capa-operador">
        <img src="9.png" class="capa-fix z3">
        <img src="10.png" class="capa-fix z4">

        <div class="logo-contenedor">
            <h1 class="logo-principal">MUNDOPARALELO<span class="punto-cl">.CL</span></h1>
        </div>

        <a href="contacto.html" class="email">
            CONTACTO@MUNDOPARALELO.CL
            <img src="11.png" style="display:block; width:200px; margin: 10px auto;">
        </a>
    </div>

    <div id="videoTeatro" class="teatro-overlay">
        <div class="contenedor-video-pro" id="hubContainer">
            <div class="scanlines"></div>
            <span class="cerrar-video" onclick="cerrarVideo()">[ X ] CERRAR INTERFAZ</span>
            <iframe id="reproductorDrive" src="" allow="autoplay"></iframe>
        </div>
    </div>

    <script>
        function verVideo() {
            const teatro = document.getElementById('videoTeatro');
            const hub = document.getElementById('hubContainer');
            const escena = document.getElementById('escena');
            const iframe = document.getElementById('reproductorDrive');

            teatro.style.display = 'flex';
            escena.classList.add('blur-active');

            // Efecto de encendido CRT
            setTimeout(() => {
                hub.classList.add('abierto');
                // URL directa sin llaves para evitar el error 404
                iframe.src = "https://drive.google.com/file/d/15qVZc8Don4ger6RPv060hzCI_fnF7fut/preview";
            }, 100);
        }

        function cerrarVideo() {
            const teatro = document.getElementById('videoTeatro');
            const hub = document.getElementById('hubContainer');
            const escena = document.getElementById('escena');
            const iframe = document.getElementById('reproductorDrive');

            hub.classList.remove('abierto');
            escena.classList.remove('blur-active');
            
            setTimeout(() => {
                teatro.style.display = 'none';
                iframe.src = "";
            }, 500);
        }
    </script>
</body>
</html>
