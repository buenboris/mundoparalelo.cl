<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundoParalelo | Master</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000; 
        }
        
        .main-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }

        .capa-fix { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        /* AJUSTE ESPECÍFICO CAPA 8: -10% hacia la izquierda */
        .capa-operador { 
            position: absolute; 
            top: 0; 
            left: -10%; /* Desplazamiento solicitado */
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            z-index: 2; 
        }

        .z1 { z-index: 1; }
        .z3 { z-index: 3; }
        .z4 { z-index: 4; }
        .z5 { z-index: 5; }

    </style>
</head>
<body>

    <div class="main-container">
        <!-- 1. Plexus fondo -->
        <img src="1.png" class="capa-fix z1">

        <!-- 8. Tu foto con el offset del 10% -->
        <img src="8.png" class="capa-operador">

        <!-- 9. Recorte (se mantiene al 0,0 para que calce con el logo) -->
        <img src="9.png" class="capa-fix z3">

        <!-- 10. Marco estructural -->
        <img src="10.png" class="capa-fix z4">

        <!-- 2. Logo (se mantiene al 0,0 para centrado perfecto) -->
        <img src="2.png" class="capa-fix z5">
    </div>

</body>
</html>
