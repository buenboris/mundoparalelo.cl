<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundoParalelo | Servicios Audiovisuales</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            overflow: hidden; background-color: #000;
        }
        
        .main-container { position: relative; width: 100vw; height: 100vh; }

        /* LOGO CENTRAL */
        .logo-contenedor {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; text-align: center; z-index: 5;
        }
        .logo-principal {
            font-family: 'Orbitron', sans-serif;
            color: #00fbff; font-size: 4vw; font-weight: 650;
            letter-spacing: 8px; text-transform: uppercase; margin: 0;
            text-shadow: 0 0 8px rgba(0, 251, 255, 0.9), 0 0 40px rgba(0, 251, 255, 0.3);
            white-space: nowrap; user-select: none;
        }
        .punto-cl { font-size: 3.5vw; }

        /* MOTOR DE VIDEO */
        .video-fondo {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }

        /* MENÚ LATERAL (LA TORRE DE BOTONES) */
        .menu-lateral {
            position: absolute;
            left: 30px; 
            top: 40%; /* Alineado con tu botón original */
            display: flex;
            flex-direction: column;
            gap: 10px; /* Espacio entre botones */
            z-index: 100;
        }

        .btn-trigger {
            width: 280px; height: 50px; 
            cursor: pointer; border-left: 3px solid #017b9e;
            background: rgba(1, 123, 158, 0.05);
            display: flex; align-items: center; padding-left: 15px;
            color: #017b9e; font-family: 'Orbitron', sans-serif;
            font-size: 11px; text-transform: uppercase;
            letter-spacing: 2px; transition: 0.3s;
        }

        .btn-trigger:hover { 
            background: rgba(1, 123, 158, 0.15);
            color: #00ffff; 
            border-left: 3px solid #00ffff;
            padding-left: 25px; /* Efecto de desplazamiento */
        }

        /* EFECTO FOTO DINÁMICA SOLO PARA EL PRIMER BOTÓN */
        .btn-trigger:hover ~ .capa-operador { left: -10%; opacity: 1; }

        /* ASSETS Y CAPAS */
        .capa-fix { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .capa-operador { 
            position: absolute; top: 0; left: -30%; width: 100%; height: 100%; 
            object-fit: cover; z-index: 2; opacity: 0; 
            transition: all 0.5s ease-in-out; pointer-events: none; 
        }
        .z3 { z-index: 3; } .z4 { z-index: 4; }

        /* CONTACTO INFERIOR */
        .email {
            position: fixed; bottom: 40px; left: 50%;
            transform: translateX(-50%); z-index: 99999;
            color: #00ffff !important; font-family: 'Orbitron', sans-serif;
            text-decoration: none; font-size: 0.8rem; letter-spacing: 3px;
            text-transform: uppercase; text-shadow: 0 0 10px #00ffff;
            background: rgba(0, 0, 0, 0.5); padding: 10px 20px; border-radius: 5px;
            transition: 0.3s;
        }
        .email:hover { color: white; text-shadow: 0 0 20px #00ffff; }

        /* RESPONSIVE (CELULAR) */
        @media (max-width: 768px) {
            .video-fondo { transform: rotate(90deg) scale(2.8); object-fit: cover; }
            .logo-principal { font-size: 9vw; }
            .menu-lateral { left: 10px; top: 55%; }
            .btn-trigger { width: 220px; font-size: 9px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <video autoplay muted loop playsinline class="video-fondo">
            <source src="./Plexus_BG.mp4" type="video/mp4">
        </video>

        <div class="menu-lateral">
            <div class="btn-trigger">SERVICIO STREAMING PROFESIONAL</div>
            
            <div class="btn-trigger" onclick="window.location.href='#contacto'">
                CONTACTO DIRECTO
            </div>
            
            <div class="btn-trigger" onclick="window.open('https://drive.google.com/file/d/15qVZc8Don4ger6RPv060hzCI_fnF7fut/view?usp=sharing', '_blank')">
                NUESTROS SERVICIOS (VER VIDEO)
            </div>

            <div class="btn-trigger" onclick="window.location.href='#portafolio'">
                PROYECTOS 3D / VR
            </div>
        </div>

        <img src="8.png" class="capa-operador">
        <img src="9.png" class="capa-fix z3">
        <img src="10.png" class="capa-fix z4">

        <div class="logo-contenedor">
            <h1 class="logo-principal">MUNDOPARALELO<span class="punto-cl">.CL</span></h1>
        </div>

        <a href="contacto.html" class="email">contacto@mundoparalelo.cl</a>
    </div>

</body>
</html>
