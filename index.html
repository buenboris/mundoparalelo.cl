<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundoParalelo | Servicios Audiovisuales</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* [ESTILOS BASE MANTENIDOS] */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        .main-container { position: relative; width: 100vw; height: 100vh; transition: filter 0.5s ease; }
        .video-fondo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        /* EFECTO BLUR PARA EL FONDO */
        .blur-active { filter: blur(10px); }

        /* MENÚ LATERAL ACTUALIZADO */
        .menu-lateral {
            position: absolute; left: 30px; top: 40%;
            display: flex; flex-direction: column; gap: 10px; z-index: 100;
        }

        .btn-trigger {
            width: 280px; height: 50px; cursor: pointer; border-left: 3px solid #017b9e;
            background: rgba(1, 123, 158, 0.05); display: flex; align-items: center;
            padding-left: 15px; color: #017b9e; font-family: 'Orbitron', sans-serif;
            font-size: 11px; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }

        .btn-trigger:hover { background: rgba(1, 123, 158, 0.15); color: #00ffff; border-left: 3px solid #00ffff; padding-left: 25px; }

        /* SISTEMA DE TEATRO CRT */
        #videoTeatro {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10000; background: rgba(0, 0, 0, 0.3); align-items: center; justify-content: center;
        }

        .rayo-calipso {
            position: absolute; width: 0%; height: 2px; background: #00fbff;
            box-shadow: 0 0 15px #00fbff, 0 0 30px #00fbff;
            transition: width 0.4s ease, height 0.3s 0.4s ease;
        }

        .rayo-active { width: 100% !important; height: 85% !important; }

        .contenedor-video-pro {
            position: relative; width: 80%; height: 80%; opacity: 0;
            transition: opacity 0.5s 0.7s ease; display: flex; align-items: center; justify-content: center;
        }

        #reproductorDrive { width: 100%; height: 100%; border: 1px solid rgba(0, 251, 255, 0.2); opacity: 0.85; }

        .cerrar-video {
            position: absolute; top: -40px; right: 0; color: #00fbff;
            font-size: 40px; cursor: pointer; text-shadow: 0 0 10px #00fbff;
        }

        /* [RESTO DE TUS ESTILOS: LOGO Y CAPAS] */
        .logo-contenedor { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; text-align: center; width: 100%; }
        .logo-principal { font-family: 'Orbitron', sans-serif; color: #00fbff; font-size: 4vw; letter-spacing: 8px; text-transform: uppercase; text-shadow: 0 0 8px rgba(0, 251, 255, 0.9); }
        .capa-fix { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .z3 { z-index: 3; } .z4 { z-index: 4; }
    </style>
</head>
<body>

    <div class="main-container" id="content">
        <video autoplay muted loop playsinline class="video-fondo">
            <source src="./Plexus_BG.mp4" type="video/mp4">
        </video>

        <div class="menu-lateral">
            <div class="btn-trigger">SERVICIO STREAMING PROFESIONAL</div>
            <div class="btn-trigger" onclick="window.location.href='#contacto'">CONTACTO DIRECTO</div>
            
            <div class="btn-trigger" onclick="verVideo()">
                NUESTROS SERVICIOS (VER VIDEO)
            </div>

            <div class="btn-trigger" onclick="window.location.href='#portafolio'">PROYECTOS 3D / VR</div>
        </div>

        <img src="9.png" class="capa-fix z3">
        <img src="10.png" class="capa-fix z4">
        
        <div class="logo-contenedor">
            <h1 class="logo-principal">MUNDOPARALELO<span class="punto-cl">.CL</span></h1>
        </div>
    </div>

    <div id="videoTeatro">
        <div class="rayo-calipso"></div>
        <div class="contenedor-video-pro">
            <span class="cerrar-video" onclick="terminarEfecto()">&times;</span>
            <iframe id="reproductorDrive" src="" frameborder="0" allow="autoplay"></iframe>
        </div>
    </div>

    <script>
        function verVideo() {
            const idVideo = "15qVZc8Don4ger6RPv060hzCI_fnF7fut"; // Tu ID de Drive 
            const teatro = document.getElementById('videoTeatro');
            const rayo = teatro.querySelector('.rayo-calipso');
            const videoCont = teatro.querySelector('.contenedor-video-pro');
            const content = document.getElementById('content');

            teatro.style.display = 'flex';
            content.classList.add('blur-active');

            setTimeout(() => { rayo.classList.add('rayo-active'); }, 100);

            setTimeout(() => {
                document.getElementById('reproductorDrive').src = `https://drive.google.com/uc?export=view&id=${idVideo}`;
                videoCont.style.opacity = '1';
            }, 800);
        }

        function terminarEfecto() {
            const teatro = document.getElementById('videoTeatro');
            const rayo = teatro.querySelector('.rayo-calipso');
            const videoCont = teatro.querySelector('.contenedor-video-pro');
            const content = document.getElementById('content');

            videoCont.style.opacity = '0';
            
            setTimeout(() => {
                rayo.classList.remove('rayo-active');
                document.getElementById('reproductorDrive').src = "";
            }, 300);

            setTimeout(() => {
                teatro.style.display = 'none';
                content.classList.remove('blur-active');
            }, 800);
        }
    </script>
</body>
</html>
