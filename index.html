<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundoParalelo | Interactive</title>
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; 
            font-family: 'Orbitron', sans-serif;
        }
        
        .main-container { position: relative; width: 100vw; height: 100vh; }

        .capa-fix { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
        }

        /* TU FOTO OPERADOR CON TRANSICIÓN SUAVE */
        .capa-operador { 
            position: absolute; 
            top: 0; 
            left: -10%; /* Posición original */
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            z-index: 2; 
            transition: left 0.6s cubic-bezier(0.25, 1, 0.5, 1); /* Movimiento fluido tipo cine */
        }

        /* ÁREA DEL BOTÓN (Invisible por ahora, solo el trigger) */
        .btn-trigger {
            position: absolute;
            left: 20px;
            top: 30%;
            width: 200px;
            height: 60px;
            z-index: 10; /* Por encima de todo para captar el mouse */
            cursor: pointer;
            border: 1px dashed rgba(0, 255, 255, 0.3); /* Guía visual temporal */
            display: flex;
            align-items: center;
            padding-left: 15px;
            color: #00ffff;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* LA MAGIA: Cuando el mouse toca el botón, la imagen se desplaza */
        .btn-trigger:hover ~ .capa-operador {
            left: 5%; /* Se desplaza a la derecha para mostrar el contenido */
        }

        .z1 { z-index: 1; }
        .z3 { z-index: 3; }
        .z4 { z-index: 4; }
        .z5 { z-index: 5; }

    </style>
</head>
<body>

    <div class="main-container">
        <!-- 1. El Trigger del Botón (Ponerlo arriba en el HTML para que el selector ~ funcione) -->
        <div class="btn-trigger">Servicio Streaming</div>

        <!-- 2. Tu foto (Ahora responde al hover del botón) -->
        <img src="8.png" class="capa-operador">

        <!-- 3. Resto de la estructura fija -->
        <img src="1.png" class="capa-fix z1">
        <img src="9.png" class="capa-fix z3">
        <img src="10.png" class="capa-fix z4">
        <img src="2.png" class="capa-fix z5">
    </div>

</body>
</html>
