<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundoParalelo | Servicios Audiovisuales</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; 
        }
        
        .main-container { position: relative; width: 100vw; height: 100vh; transition: 0.5s; }
        .blur-active { filter: blur(10px) brightness(0.4); }

        /* EL MOTOR DE VIDEO FONDO */
        .video-fondo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        /* CAPAS VISUALES */
        .capa-fix { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .capa-operador { 
            position: absolute; top: 0; left: -30%; width: 100%; height: 100%; 
            object-fit: cover; z-index: 2; opacity: 0; transition: all 0.5s ease-in-out; pointer-events: none;
        }

        /* LOGO CENTRAL */
        .logo-contenedor {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; text-align: center; z-index: 5;
        }
        .logo-principal {
            font-family: 'Orbitron', sans-serif; color: #00fbff; font-size: 4vw;
            letter-spacing: 8px; text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 251, 255, 0.9);
        }

        /* MENÚ LATERAL ORDENADO */
        .menu-lateral {
            position: absolute; left: 30px; top: 35%; z-index: 20;
            display: flex; flex-direction: column; gap: 15px;
        }

        .btn-trigger {
            width: 220px; height: 50px; cursor: pointer; border-left: 3px solid #017b9e;
            background: rgba(1, 123, 158, 0.05); display: flex; align-items: center;
            padding-left: 15px; color: #017b9e; font-family: 'Orbitron', sans-serif;
            font-size: 10px; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }

        .btn-trigger:hover { background: rgba(1, 123, 158, 0.15); color: #00ffff; border-left: 3px solid #00ffff; }
        .btn-trigger:hover ~ .capa-operador { left: -10%; opacity: 1; }

        /* CONTACTO INFERIOR */
        .email {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 999; color: #00ffff; font-family: 'Orbitron', sans-serif;
            text-decoration: none; font-size: 0.8rem; letter-spacing: 3px;
            text-shadow: 0 0 10px #00ffff; text-align: center;
        }
        .capa-mail { display: block; width: 250px; margin: 10px auto; }

        /* SISTEMA DE TEATRO PARA VIDEO DRIVE */
        .teatro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center;
            align-items: center; z-index: 10000;
        }
        .rayo-calipso {
            position: absolute; width: 0%; height: 2px; background: #00ffff;
            box-shadow: 0 0 25px #00ffff; transition: width 0.4s ease-in-out;
        }
        .rayo-active { width: 100%; }
        .contenedor-video-pro {
            width: 80%; max-width: 1000px; aspect-ratio: 16/9; opacity: 0; transition: 0.6s;
        }
        #reproductorDrive { width: 100%; height: 100%; border: 1px solid #00ffff; }
        .cerrar-video { position: absolute; top: -40px; right: 0; color: #00ffff; font-size: 30px; cursor: pointer; }

        @media (max-width: 768px) {
            .logo-principal { font-size: 8vw; }
            .menu-lateral { left: 10px; top: 25%; }
            .btn-trigger { width: 180px; font-size: 8px; }
        }
    </style>
</head>
<body>

    <div class="main-container" id="contenidoPrincipal">
        <div class="menu-lateral">
            <div class="btn-trigger">SERVICIO STREAMING PROFESIONAL</div>
            <div class="btn-trigger" onclick="verVideo()">NUESTROS SERVICIOS (VER VIDEO)</div>
            <div class="btn-trigger" onclick="location.href='contacto.html'">CONTACTO DIRECTO</div>
            <div class="btn-trigger">PROYECTOS 3D / VR</div>
        </div>

        <video autoplay muted loop playsinline class="video-fondo">
            <source src="./Plexus_BG.mp4" type="video/mp4">
        </video>

        <img src="8.png" class="capa-operador">
        <img src="9.png" class="capa-fix" style="z-index:3">
        <img src="10.png" class="capa-fix" style="z-index:4">

        <div class="logo-contenedor">
            <h1 class="logo-principal">MUNDOPARALELO<span style="font-size:3vw">.CL</span></h1>
        </div>

        <a href="contacto.html" class="email">
            CONTACTO@MUNDOPARALELO.CL
            <img src="11.png" class="capa-mail">
        </a>
    </div>

    <div id="videoTeatro" class="teatro-overlay">
        <div class="rayo-calipso"></div>
        <div class="contenedor-video-pro">
            <span class="cerrar-video" onclick="terminarEfecto()">&times; Cerrar</span>
            <iframe id="reproductorDrive" src="" allow="autoplay"></iframe>
        </div>
    </div>

    <script>
        function verVideo() {
            const idVideo = "15qVZc8Don4ger6RPv060hzCI_fnF7fut";
            const teatro = document.getElementById('videoTeatro');
            const main = document.getElementById('contenidoPrincipal');
            const rayo = teatro.querySelector('.rayo-calipso');
            
            teatro.style.display = 'flex';
            main.classList.add('blur-active');
            
            setTimeout(() => { rayo.classList.add('rayo-active'); }, 100);
            setTimeout(() => {
                document.getElementById('reproductorDrive').src = `https://drive.google.com/file/d/15qVZc8Don4gEr6RPv060hzCI_fnF7fut/preview`;
                teatro.querySelector('.contenedor-video-pro').style.opacity = '1';
            }, 800);
        }

        function terminarEfecto() {
            const teatro = document.getElementById('videoTeatro');
            const main = document.getElementById('contenidoPrincipal');
            document.getElementById('reproductorDrive').src = "";
            teatro.style.display = 'none';
            main.classList.remove('blur-active');
            teatro.querySelector('.rayo-calipso').classList.remove('rayo-active');
        }
    </script>
</body>
</html>
