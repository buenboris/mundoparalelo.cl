<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundoParalelo | Interactive Pro</title>
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; 
        }
        
        .main-container { position: relative; width: 100vw; height: 100vh; }

        .capa-fix { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
        }

        /* TU FOTO: Estado inicial (Landing) - Invisible y desplazada a la izquierda */
        .capa-operador { 
            position: absolute; 
            top: 0; 
            left: -30%; /* Más lejos para que el "slide in" sea notable */
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            z-index: 2; 
            opacity: 0; /* Invisible en el landing */
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); /* Entrada rápida y suave */
            pointer-events: none; /* Para que no interfiera con el mouse si pasa encima */
        }

        /* ÁREA DEL BOTÓN */
        .btn-trigger {
            position: absolute;
            left: 20px;
            top: 35%;
            width: 250px;
            height: 80px;
            z-index: 10; 
            cursor: pointer;
            border-left: 3px solid rgba(0, 255, 255, 0.5); /* Estética de interfaz técnica */
            background: rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            padding-left: 20px;
            color: #00ffff;
            font-family: Arial, sans-serif; /* Luego pondremos Orbitron */
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        /* LA LÓGICA DE REACCIÓN */
        /* Cuando el mouse entra (Hover), la foto aparece y se clava en el -10% */
        .btn-trigger:hover ~ .capa-operador {
            left: -10%; 
            opacity: 1;
        }

        /* Si el mouse sale, la transición de la clase .capa-operador 
           hace que se devuelva automáticamente al -30% y opacidad 0 */

        .z1 { z-index: 1; }
        .z3 { z-index: 3; }
        .z4 { z-index: 4; }
        .z5 { z-index: 5; }

    </style>
</head>
<body>

    <div class="main-container">
        <!-- El Trigger debe ir antes de la imagen para que el selector "~" funcione -->
        <div class="btn-trigger">Servicio Streaming Profesional</div>

        <!-- Tu foto (Capa 8) -->
        <img src="8.png" class="capa-operador">

        <!-- Estructura Fija (Landing) -->
        <img src="1.png" class="capa-full z1">
        <img src="9.png" class="capa-full z3">
        <img src="10.png" class="capa-full z4">
        <img src="2.png" class="capa-full z5">
    </div>

</body>
</html>
