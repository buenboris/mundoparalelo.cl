<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundoParalelo | Live Session</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
/* --- Optimización para Smartphone (Vertical) --- */
        @media (max-width: 768px) and (orientation: portrait) {
            .video-fondo, .mask {
                /* Rotamos 90 grados y escalamos para que el video horizontal cubra el alto del celular */
                transform: rotate(90deg) scale(2.8); 
                transform-origin: center;
                object-fit: cover;
            }

            .main-container {
                /* Centramos todo el contenido en el eje vertical del teléfono */
                padding: 15px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            h1 {
                /* El logo de MundoParalelo se ajusta al ancho del celular sin romperse */
                font-size: 9vw; 
                width: 95%;
                margin-bottom: 20px;
            }

            .email {
                /* Ajustamos el tamaño del texto del mail para que sea legible en pantallas pequeñas */
                font-size: 4.5vw;
                bottom: 8%;
            }
        }
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; 
        }
        
        .main-container { position: relative; width: 100vw; height: 100vh; }

        /* EL MOTOR DE VIDEO */
        .video-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .capa-fix { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            pointer-events: none; 
        }

        .capa-operador { 
            position: absolute; top: 0; left: -30%; 
            width: 100%; height: 100%; 
            object-fit: cover; z-index: 2; opacity: 0; 
            transition: all 0.5s ease-in-out; pointer-events: none;
        }

        .capa-mail { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; z-index: 6; cursor: pointer; pointer-events: auto;
        }

        .btn-trigger {
            position: absolute; left: 30px; top: 40%;
            width: 220px; height: 60px; z-index: 10; 
            cursor: pointer; border-left: 3px solid #017b9e;
            background: rgba(1, 123, 158, 0.05);
            display: flex; align-items: center; padding-left: 15px;
            color: #017b9e; font-family: 'Orbitron', sans-serif;
            font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
            transition: 0.3s;
        }

        .btn-trigger:hover { background: rgba(1, 123, 158, 0.15); color: #00ffff; border-left: 3px solid #00ffff; }
        .btn-trigger:hover ~ .capa-operador { left: -10%; opacity: 1; }

        .z3 { z-index: 3; } .z4 { z-index: 4; } .z5 { z-index: 5; }
  .contact-container {
    position: relative;
    z-index: 100; /* Asegura que esté por encima del video pero no cubra todo */
    text-align: center; /* O la posición que prefieras */
    margin-top: 20px;
}

.email {
    display: inline-block; /* Evita que sea gigante */
    position: relative;    /* Permite usar z-index */
    z-index: 9999 !important; /* Lo trae al frente de TODO */
    color: #00ffff;        /* Asegúrate de que el color sea visible */
    text-decoration: none;
    pointer-events: auto;  /* Activa los clics */
    margin-top: 20px;      /* Espacio para que no choque con lo de arriba */
}

.capa-mail {
    display: block;
    width: 100%;           /* O el ancho que necesites para la imagen 11.png */
    max-width: 300px;
    margin: 10px auto;
}
    </style>
</head>
<body>

    <div class="main-container">
        <div class="btn-trigger">SERVICIO STREAMING PROFESIONAL</div>

        <!-- VIDEO BACKGROUND BLINDADO -->
        <video autoplay muted loop playsinline class="video-fondo">
            <source src="./Plexus_BG.mp4" type="video/mp4">
            Tu navegador no soporta video.
        </video>

        <!-- TU FOTO DINÁMICA -->
        <img src="8.png" class="capa-operador">

        <!-- ASSETS ESTÁTICOS -->
        <img src="9.png" class="capa-fix z3">
        <img src="10.png" class="capa-fix z4">
        <img src="2.png" class="capa-fix z5">

       <!-- CONTACTO -->
<div class="contact-container"> 
    <a href="contacto.html" class="email">
        contacto@mundoparalelo.cl
        <img src="11.png" class="capa-mail">
    </a>
</div>

</body>
</html>
