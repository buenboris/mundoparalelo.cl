<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | MundoParalelo</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Orbitron', sans-serif;
        }

        /* Reutilizamos tu Plexus de fondo */
        .video-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
}

.container {
    position: relative;
    z-index: 1; /* Pone el formulario al frente */
}

        .container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .contact-box {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffff;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            text-align: center;
        }

        h2 { color: #00ffff; margin-bottom: 30px; letter-spacing: 3px; }

        .contact-form { display: flex; flex-direction: column; gap: 20px; }

        input, textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #00ffff;
            padding: 15px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            outline: none;
        }

        button {
            background: #00ffff;
            color: black;
            border: none;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.4s;
            letter-spacing: 2px;
        }

        button:hover {
            background: white;
            box-shadow: 0 0 15px #00ffff;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #00ffff;
            text-decoration: none;
            font-size: 0.8em;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="video-fondo">
    <!-- Verifica que el nombre del archivo sea exacto al de tu repo -->
    <source src="Plexus_BG.mp4" type="video/mp4">
</video>

<div class="container">
    <div class="contact-box">
        <h2>CONTACTO</h2>
        <form action="https://formspree.io/f/mbdwkjpv" method="POST" class="contact-form">
    <input type="hidden" name="_next" value="https://mundoparalelo.cl/gracias.html">
    
    <input type="email" name="email" placeholder="TU@EMAIL.COM" required>
    <textarea name="message" rows="5" placeholder="MENSAJE" required></textarea>
    <button type="submit">ENVIAR INTERFAZ</button>
        <a href="index.html" class="back-link">VOLVER AL INICIO</a>
    </div>
</div>

</body>
</html>
